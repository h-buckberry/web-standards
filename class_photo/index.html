<head>
  <style>
    .body1 {
      width: 100%;
      height: 55%;
      background: rgb(255, 255, 255);
      clip-path: polygon(
        0 7%,
        7% 0%,
        93% 0%,
        100% 7%,
        100% 26%,
        85% 26%,
        85% 100%,
        15% 100%,
        15% 26%,
        0 26%
      );
      background-image: url(carhartt-logo.png);
      background-size: 40vh;
      background-position: center;
      background-repeat: no-repeat;
    }

    .arm1 {
      width: 12%;
      height: 50%;
      background: rgb(210, 157, 97);
      clip-path: polygon(0% 8%, 0% 100%, 90% 100%, 90% 0%);
      float: left;
    }
    .arm2 {
      width: 12%;
      height: 50%;
      background: rgb(210, 157, 97);
      clip-path: polygon(10% 0, 10% 100%, 100% 100%, 100% 14%);
      float: right;
    }

    .leg1 {
      background-color: rgba(1, 85, 1, 0.786);
      width: 45%;
      height: 50%;
      clip-path: polygon(30% 0%, 100% 0%, 80% 100%, 20% 100%);
      float: left;
    }

    .leg2 {
      background-color: rgba(1, 85, 1, 0.786);
      width: 45%;
      height: 50%;
      clip-path: polygon(0 0, 70% 0, 90% 100%, 30% 100%);
      float: right;
    }

    .foot1 {
      background-color: black;
      width: 40%;
      height: 10%;
      border-radius: 10%;
      float: left;
    }

    .foot2 {
      background-color: black;
      width: 40%;
      height: 10%;
      border-radius: 10%;
      float: right;
    }
  </style>
</head>

<body style="background: rgb(147, 236, 234); margin: 30; font-size: 12vh">
  <div
    style="
      width: 100%;
      height: 13vh;
      background: rgb(77, 51, 21);
      clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
      display: flex;
      justify-content: end;
      align-items: end;
    "
  >
    <div
      style="
        width: 100%;
        height: 50px;
        background: rgb(210, 157, 97);
        clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
      "
    ></div>
  </div>

  <div
    style="
      width: 100%;
      height: 90px;
      background: rgb(210, 157, 97);
      display: flex;
      justify-content: center;
      align-items: center;
    "
  >
    <p style="transform: rotate(90deg)">:-</p>
  </div>

  <div
    style="
      width: 100%;
      height: 140px;
      background: rgb(210, 157, 97);
      clip-path: polygon(0% 0%, 100% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      display: flex;
      justify-content: center;
      align-items: center;
    "
  >
    <div
      style="
        width: 100%;
        height: 18vh;
        background: rgb(77, 51, 21);
        clip-path: polygon(
          30% 80%,
          70% 80%,
          100% 20%,
          100% 70%,
          75% 100%,
          25% 100%,
          0% 70%,
          0% 20%
        );
        display: flex;
        justify-content: end;
        align-items: end;
      "
    ></div>
  </div>

  <div class="arm1"></div>
  <div class="arm2"></div>
  <div class="body1"></div>

  <div class="leg1"></div>
  <div class="leg2"></div>

  <div class="foot1"></div>
  <div class="foot2"></div>
</body>
